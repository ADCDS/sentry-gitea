name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste tokens, OAuth secrets, webhook secrets or private URLs.
        Security vulnerabilities go to a private advisory instead (see SECURITY.md).
  - type: dropdown
    id: mode
    attributes:
      label: Which part is affected?
      options:
        - Project plugins (Gitea / Gitea Alerts)
        - Organization integration
        - Both / not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: sentry-gitea version or commit, self-hosted Sentry version, Gitea version.
      placeholder: "sentry-gitea 0.2.0, Sentry 26.3.1, Gitea 28.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant settings (redacted) and, for alerts, the rule's triggers and action.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Lines containing `sentry-gitea:` from the web or taskworker containers. Redact anything sensitive.
      render: text
